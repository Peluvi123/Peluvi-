<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar contraseña · Peluvi</title><link rel="stylesheet" href="/portal/portal.css"><style>body{font-family:system-ui;background:#f7f4fc;color:#241735}main{max-width:400px;margin:8vh auto;background:white;border:1px solid #e5dcf4;border-radius:24px;padding:32px}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #ddcff2;margin-top:8px;font:inherit}button{background:#783af0;color:white;cursor:pointer}button:disabled{opacity:.5}a{color:#7135da}p{line-height:1.6}[hidden]{display:none!important}</style></head><body><main><h1>Recupera tu acceso</h1><p id="status" role="status">Comprobando el enlace…</p><form id="reset" hidden><label>Nueva contraseña<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Repite la contraseña<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button>Guardar contraseña</button></form><p><a href="/admin/">Volver al administrador</a></p></main><script type="module" src="/admin/recovery.js"></script></body></html>
